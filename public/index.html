@font-face{

@font-face{

  src:url('https://github.com/agonzalez-cooltra/CooltraFonts/raw/refs/heads/main/CooltraGilroy-ExtraBold.otf') format('opentype');
  font-weight:800;font-display:swap;
}

:root{
  --asphalt:#052f62;      /* Cooltra Dark Blue — cabecera y fondos oscuros */
  --concrete:#EDEFF2;
  --panel:#FFFFFF;
  --ink:#14161A;
  --ink-soft:#5B5F68;
  --line:#DADDE3;
  --hazard:#008aff;       /* Cooltra Blue — acciones principales */
  --hazard-ink:#feffff;   /* Blanco — texto sobre azul, según norma de marca */
  --brand-green:#05e100;  /* Cooltra Green — SOLO acento/icono, nunca texto */
  --brand-light:#8ec8ff;  /* Cooltra Light Blue */
  --brand-deep:#063063;   /* Cooltra Deep Blue */
  --ok:#157A45;
  --ok-bg:#E1F7E0;
  --warn:#ec6e24;         /* Cooltra Orange — su propio uso oficial de aviso */
  --warn-bg:#FCE7DA;
  --bad:#D5473B;
  --bad-bg:#FBE7E4;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--concrete);
  color:var(--ink);
  font-family:'CooltraGilroy',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.app{max-width:520px;margin:0 auto;padding-bottom:64px;min-height:100vh;}

.topbar{
  background:var(--asphalt);
  color:#fff;
  padding:20px 20px 30px;
  position:relative;
  overflow:hidden;
}
.topbar::after{
  content:"";
  position:absolute;
  right:-40px;top:-40px;
  width:180px;height:180px;
  background:radial-gradient(circle, var(--brand-green) 0%, transparent 70%);
  opacity:.22;
  border-radius:50%;
}
.eyebrow{font-family:'CooltraGilroy',Arial,sans-serif;font-size:12px;letter-spacing:.06em;color:var(--hazard);margin:0 0 4px;}
.topbar h1{font-family:'CooltraGilroy',Arial,sans-serif;font-weight:600;font-size:24px;line-height:1.15;margin:0;max-width:340px;}

.tabs{display:flex;gap:8px;margin:-16px 16px 0;position:relative;z-index:2;}
.tab{flex:1;text-align:center;padding:11px 6px;border-radius:10px;font-size:13.5px;font-weight:600;background:var(--panel);color:var(--ink-soft);border:1px solid var(--line);cursor:pointer;}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.storage-banner{margin:14px 16px 0;padding:10px 13px;border-radius:10px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;}
.storage-banner.ok{background:var(--ok-bg);color:var(--ok);}
.storage-banner.warn{background:var(--warn-bg);color:#8a6116;}

.screen{padding:20px 16px 0;display:none;}
.screen.active{display:block;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input[type=text], .field textarea, .field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:15px;font-family:inherit;background:#FBFBFC;color:var(--ink);}
.field select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%235B5F68' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;}
.field textarea{resize:vertical;min-height:60px;}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1;}

.plate-capture{display:flex;gap:8px;align-items:stretch;}
.plate-capture .field{flex:1;margin-bottom:0;}
.plate-cam-btn{
  width:48px;flex-shrink:0;border:1px solid var(--line);border-radius:9px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;color:var(--ink);
}
.plate-status{font-size:12px;margin-top:6px;display:flex;align-items:center;gap:6px;color:var(--ink-soft);}
.plate-status.busy{color:#8a6116;}
.plate-status.ok{color:var(--ok);}
.plate-thumb{width:100%;max-height:130px;object-fit:cover;border-radius:9px;margin-top:8px;border:1px solid var(--line);}

.btn-primary{width:100%;background:var(--hazard);color:var(--hazard-ink);border:none;border-radius:11px;padding:15px;font-size:15.5px;font-weight:800;font-family:'CooltraGilroy',Arial,sans-serif;letter-spacing:.02em;cursor:pointer;margin-top:6px;}
.btn-secondary{width:100%;background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:11px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}

/* ---- Wizard ---- */
.wizard-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.wizard-back{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;color:var(--ink);
}
.wizard-back.hidden{visibility:hidden;}
.wizard-progress{flex:1;}
.wizard-progress-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:5px;}
.wizard-bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;}
.wizard-bar-fill{height:100%;background:var(--hazard);border-radius:6px;transition:width .25s ease;}

.item-screen{text-align:center;padding:10px 0 4px;}
.item-icon{font-size:42px;margin-bottom:6px;}
.item-title{font-family:'CooltraGilroy',Arial,sans-serif;font-size:23px;font-weight:600;margin:0 0 4px;}
.item-hint{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}

.option-list{display:flex;flex-direction:column;gap:10px;}
.option-btn{
  width:100%;
  text-align:left;
  padding:16px 18px;
  border-radius:13px;
  border:1.5px solid var(--line);
  background:#fff;
  font-size:15.5px;
  font-weight:600;
  color:var(--ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:transform .1s ease, background .15s ease, border-color .15s ease;
}
.option-btn:active{transform:scale(.98);}
.option-btn .tone-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-left:10px;}
.option-btn[data-tone="ok"] .tone-dot{background:var(--ok);}
.option-btn[data-tone="warn"] .tone-dot{background:var(--warn);}
.option-btn[data-tone="bad"] .tone-dot{background:var(--bad);}
.option-btn.selected[data-tone="ok"]{background:var(--ok-bg);border-color:var(--ok);}
.option-btn.selected[data-tone="warn"]{background:var(--warn-bg);border-color:var(--warn);}
.option-btn.selected[data-tone="bad"]{background:var(--bad-bg);border-color:var(--bad);}

.skip-link{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;}

.accordion-list{display:flex;flex-direction:column;gap:10px;}
.accordion-section{background:var(--panel);border:1.5px solid var(--line);border-radius:13px;overflow:hidden;}
.accordion-section.open{border-color:var(--hazard);}
.accordion-header{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:15px 16px;background:none;border:none;cursor:pointer;text-align:left;
  font-family:'CooltraGilroy',Arial,sans-serif;font-size:15px;font-weight:600;color:var(--ink);
}
.accordion-chevron{font-size:18px;font-weight:700;color:var(--ink-soft);flex-shrink:0;margin-left:10px;}

<body>

<script>
// ---- Item definitions ----
// Each item has its own set of options with a tone: ok / warn / bad
const GENERIC_OPTIONS = [
  {id:'bien', label:'En buen estado', tone:'ok'},
  {id:'regular', label:'Regular', tone:'warn'},

const PLASTICOS_OPTIONS = [

const STICKERS_OPTIONS = [

const ITEMS = [

  {id:'asiento', section:'cliente', label:'Asiento', options:[

    {id:'sin_tornillo_parte', label:'Falta tornillo/parte derecha', tone:'bad'},

    {id:'mal_dos', label:'Los dos en mal estado (se mueven o no están fijos)', tone:'bad'},
    {id:'falta_derecho', label:'Falta el derecho', tone:'bad'},
    {id:'falta_izquierdo', label:'Falta el izquierdo', tone:'bad'},
    {id:'faltan_dos', label:'Faltan los dos', tone:'bad'},
  ]},
  // --- Plásticos: grupo con desplegable ---
  {id:'plasticos_laterales', section:'cliente', group:'plasticos', groupLabel:'Plásticos', label:'Plásticos laterales', options: PLASTICOS_OPTIONS},
  {id:'plasticos_frontal_quilla', section:'cliente', group:'plasticos', groupLabel:'Plásticos', label:'Plásticos Frontales y Quilla', options: PLASTICOS_OPTIONS},
  {id:'plasticos_foco', section:'cliente', group:'plasticos', groupLabel:'Plásticos', label:'Plásticos del foco de luces', options: PLASTICOS_OPTIONS},
  {id:'guardabarros_delantero', section:'cliente', group:'plasticos', groupLabel:'Plásticos', label:'Guardabarros delantero', options: PLASTICOS_OPTIONS},
  {id:'guardabarros_trasero', section:'cliente', group:'plasticos', groupLabel:'Plásticos', label:'Guardabarros trasero', options: PLASTICOS_OPTIONS},
  // --- Stickers: grupo con desplegable ---
  {id:'stickers_topcase', section:'cliente', group:'stickers', groupLabel:'Stickers', label:'Stickers topcase', options: STICKERS_OPTIONS},
  {id:'stickers_laterales', section:'cliente', group:'stickers', groupLabel:'Stickers', label:'Stickers plásticos laterales (Cooltra)', options: STICKERS_OPTIONS},
  {id:'limpieza', section:'cliente', label:'Limpieza general', type:'multi', options:[
    {id:'bien', label:'En buen estado', tone:'ok', exclusive:true},
    {id:'plasticos_sucios', label:'Plásticos sucios', tone:'warn'},
    {id:'dashboard_sucio', label:'Dashboard sucio', tone:'warn'},
    {id:'topcase_ext_sucio', label:'Topcase exterior', tone:'warn'},
    {id:'manillas_sucias', label:'Manillas/Puños sucios', tone:'bad'},
    {id:'topcase_int_sucio', label:'Topcase interior', tone:'bad'},

  ]},
  {id:'topcase', section:'cliente', label:'Topcase', type:'multi', options:[
    {id:'bien', label:'En buen estado', tone:'ok', exclusive:true},
    {id:'rallado', label:'Rallado', tone:'warn'},

  {id:'neumaticos_visual', section:'cliente', label:'Neumáticos', options:[

    {id:'pinchadas_dos', label:'2 ruedas deshinchadas', tone:'bad'},
  ]},
  {id:'redecilla', section:'cliente', label:'Redecilla del casco', options:[
    {id:'suficientes', label:'Hay suficientes (más de 5)', tone:'ok'},
    {id:'pocas', label:'No hay suficientes (3)', tone:'warn'},
    {id:'no_hay', label:'No hay (0)', tone:'bad'},
  ]},
  // --- Revisión técnica ---
  // --- Frenos: grupo con desplegable ---
  {id:'freno_del', section:'tecnica', group:'frenos', groupLabel:'Frenos', label:'Freno delantero', options: FRENO_OPTIONS},
  {id:'freno_tras', section:'tecnica', group:'frenos', groupLabel:'Frenos', label:'Freno trasero', options: FRENO_OPTIONS},
  {id:'luces', section:'tecnica', label:'Luces', type:'multi', options:[
    {id:'bien', label:'En buen estado', tone:'ok', exclusive:true},
    {id:'no_delanteras', label:'No funcionan las delanteras', tone:'bad'},
    {id:'no_traseras', label:'No funcionan las traseras', tone:'bad'},
    {id:'no_intermitentes', label:'No funcionan los intermitentes', tone:'bad'},
  ]},
  {id:'dashboard', section:'tecnica', label:'Dashboard / pantalla', options:[
    {id:'bien', label:'En buen estado', tone:'ok'},
    {id:'mejorable', label:'No se ve bien definido', tone:'warn'},
    {id:'agua', label:'Agua filtrada/condensación en el interior', tone:'warn'},
    {id:'no_funciona', label:'No funciona', tone:'bad'},
  ]},
  {id:'tapon_rueda', section:'tecnica', label:'Tapón de válvula del neumático', options:[
    {id:'bien', label:'Están los dos', tone:'ok'},

    {id:'faltan_dos', label:'Faltan los dos', tone:'bad'},
  ]},
  // --- Maneta de freno y puño: grupo con desplegable ---
  {id:'maneta_freno', section:'tecnica', group:'maneta_puno', groupLabel:'Maneta de freno y puño', label:'Maneta de freno', options:[
    {id:'bien', label:'En buen estado', tone:'ok'},

    {id:'rota', label:'Está partida o rota', tone:'bad'},
  ]},
  {id:'puno', section:'tecnica', group:'maneta_puno', groupLabel:'Maneta de freno y puño', label:'Puño', options:[
    {id:'hay_puno', label:'Hay puño', tone:'ok'},
    {id:'algo_holgura', label:'Hay algo de holgura', tone:'warn'},
    {id:'no_hay_puno', label:'No hay puño', tone:'bad'},
  ]},
  {id:'arranque', section:'tecnica', label:'Arranque', options:[
    {id:'bien', label:'En buen estado', tone:'ok'},
    {id:'no_primera', label:'No arranca a la primera', tone:'bad'},
    {id:'no_consigue', label:'No consigue arrancar', tone:'bad'},
  ]},
];

// Agrupa los ITEMS consecutivos que comparten "group" en un único paso del asistente
function buildWizardSteps(items){
  const steps = [];
  let i = 0;
  while(i < items.length){
    const it = items[i];
    if(it.group){
      const groupId = it.group;
      const groupLabel = it.groupLabel;
      const subitems = [];
      while(i < items.length && items[i].group === groupId){
        subitems.push(items[i]);
        i++;
      }
      steps.push({type:'group', groupId, groupLabel, subitems});
    } else {
      steps.push({type:'single', item: it});
      i++;
    }
  }
  return steps;
}
const WIZARD_STEPS = buildWizardSteps(ITEMS);

// Para poder saltar directamente a un item concreto desde el resumen final
const ITEM_STEP_LOOKUP = {};
WIZARD_STEPS.forEach((step, stepIdx)=>{
  if(step.type === 'single'){
    ITEM_STEP_LOOKUP[step.item.id] = {stepIdx, subIdx:0};
  } else {
    step.subitems.forEach((si, subIdx)=>{ ITEM_STEP_LOOKUP[si.id] = {stepIdx, subIdx}; });
  }
});

// Active Cooltra fleet cities (from data warehouse, last 7 days of real fleet)
const CITIES = ['Barcelona','Lisbon','Madrid','Milan','Paris','Rome','Seville','Turin','Valencia'];

// Tu propio backend real en Cloudflare — funciona igual dentro o fuera de Claude
const API_BASE = 'https://auditoria-flota.cooltra-flota.workers.dev';

// steps: 0 = intake, 1..N = pasos del asistente (WIZARD_STEPS), N+1 = review
const TOTAL_STEPS = WIZARD_STEPS.length + 2;
let stepIndex = 0;
let groupSubIndex = 0; // qué sub-parte toca dentro del paso actual, si es un grupo
let form = {city:'', plate:'', comment:''};
let answers = {};
let currentAuditId = crypto.randomUUID();
let pendingPhotos = {}; // campo -> File
let photoTargetCampo = null;

function goToStep(newIndex){
  stepIndex = newIndex;
  groupSubIndex = 0;
  renderWizard();
}

document.getElementById('photo-input').addEventListener('change', (ev)=>{
  const file = ev.target.files[0];
  if(file && photoTargetCampo){
    pendingPhotos[photoTargetCampo] = file;
  }
  ev.target.value = '';
  photoTargetCampo = null;
  renderWizard();
});

function itemById(id){ return ITEMS.find(it=>it.id===id); }
function optionFor(itemId, optId){
  const it = itemById(itemId);
  if(!it) return null;
  return it.options.find(o=>o.id===optId) || null;
}

function toneForAnswer(item, ansVal){
  if(item.type === 'multi'){
    if(!Array.isArray(ansVal) || ansVal.length===0) return null;
    const tones = ansVal.map(optId=>{
      const opt = item.options.find(o=>o.id===optId);
      return opt ? opt.tone : null;
    }).filter(Boolean);
    if(tones.includes('bad')) return 'bad';
    if(tones.includes('warn')) return 'warn';
    return 'ok';
  }
  if(!ansVal) return null;
  const opt = item.options.find(o=>o.id===ansVal);
  return opt ? opt.tone : null;
}

function labelsForAnswer(item, ansVal){
  if(item.type === 'multi'){
    if(!Array.isArray(ansVal) || ansVal.length===0) return [];
    return ansVal.map(optId=>{
      const opt = item.options.find(o=>o.id===optId);
      return opt ? opt.label : optId;
    });
  }
  if(!ansVal) return [];
  const opt = item.options.find(o=>o.id===ansVal);
  return opt ? [opt.label] : [];
}

// ---- Rendering the wizard ----
function renderWizard(){
  saveDraftToLocalStorage();
  const el = document.getElementById('wizard-container');
  const progressPct = Math.round((stepIndex/(TOTAL_STEPS-1))*100);

  let inner = '';
  if(stepIndex === 0){
    inner = renderIntake();
  } else if(stepIndex <= WIZARD_STEPS.length){
    const step = WIZARD_STEPS[stepIndex-1];
    inner = step.type === 'group' ? renderGroupStep(step) : renderItemStep(step.item);
  } else {
    inner = renderReview();
  }

  el.innerHTML = `
    <div class="wizard-top">
      <div class="wizard-back ${stepIndex===0?'hidden':''}" id="wizard-back">‹</div>
      <div class="wizard-progress">
        <div class="wizard-progress-label">${stepLabel()}</div>
        <div class="wizard-bar"><div class="wizard-bar-fill" style="width:${progressPct}%"></div></div>
      </div>
    </div>
    ${inner}
  `;

  const backBtn = document.getElementById('wizard-back');
  if(backBtn) backBtn.addEventListener('click', ()=>{ if(stepIndex>0){ goToStep(stepIndex-1); } });

  wireStepEvents();
}

function stepLabel(){
  if(stepIndex===0) return 'Datos de la moto';
  if(stepIndex<=WIZARD_STEPS.length) return `Punto ${stepIndex} de ${WIZARD_STEPS.length}`;
  return 'Resumen y guardado';
}

function renderIntake(){
  return `
    <div class="card">
      <div class="field">
        <label>Ciudad</label>
        <select id="f-city">
          <option value="" ${form.city===''?'selected':''} disabled>Selecciona una ciudad</option>
          ${CITIES.map(c=>`<option value="${c}" ${form.city===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin-bottom:6px;">
        <label>Matrícula</label>
        <div class="plate-capture">
          <input type="text" id="f-plate" list="plate-datalist" autocomplete="off" placeholder="Ej. 4521-XYZ" value="${escapeAttr(form.plate)}">
          <div class="plate-cam-btn" id="plate-cam-btn" title="Tomar foto de la matrícula">📷</div>
        </div>
        <datalist id="plate-datalist"></datalist>
        <input type="file" id="plate-photo" accept="image/*" capture="environment" style="display:none;">
        <div id="plate-status"></div>
      </div>
    </div>
    <button class="btn-primary" id="start-btn">Empezar revisión</button>
  `;
}

function renderPhotoPrompt(campo){
  const file = pendingPhotos[campo];
  if(file){
    const url = URL.createObjectURL(file);
    return `
      <div class="photo-prompt has-photo">
        <img src="${url}" class="photo-thumb">
        <div class="photo-prompt-text">Foto añadida ✓</div>
        <button class="photo-remove-btn" data-campo="${campo}">Quitar foto</button>
      </div>`;
  }
  return `
    <div class="photo-prompt">
      <div class="photo-prompt-text">Este punto está en rojo. ¿Añadir una foto? (opcional)</div>
      <button class="photo-add-btn" data-campo="${campo}">📷 Añadir foto</button>
    </div>`;
}

function renderItemStep(item){
  const currentAnswer = answers[item.id];
  const isBad = toneForAnswer(item, currentAnswer) === 'bad';

  if(item.type === 'multi'){
    const selected = Array.isArray(currentAnswer) ? currentAnswer : [];
    return `
      <div class="item-screen">
        <h2 class="item-title">${item.label}</h2>
        <p class="item-hint">Puedes marcar varias opciones a la vez</p>
      </div>
      <div class="option-list">
        ${item.options.map(opt=>`
          <button class="option-btn option-btn-multi ${selected.includes(opt.id)?'selected':''}" data-tone="${opt.tone}" data-item="${item.id}" data-opt="${opt.id}" data-exclusive="${opt.exclusive?'1':'0'}">
            <span>${opt.label}</span>
            <span class="tone-dot"></span>
          </button>
        `).join('')}
      </div>
      ${isBad ? renderPhotoPrompt(item.id) : ''}
      <button class="btn-primary" id="continue-btn" style="margin-top:16px;">Continuar</button>
      <button class="skip-link" id="skip-btn">Saltar este punto</button>
    `;
  }

  return `
    <div class="item-screen">
      <h2 class="item-title">${item.label}</h2>
      <p class="item-hint">Toca la opción que mejor describe lo que ves</p>
    </div>
    <div class="option-list">
      ${item.options.map(opt=>`
        <button class="option-btn ${currentAnswer===opt.id?'selected':''}" data-tone="${opt.tone}" data-item="${item.id}" data-opt="${opt.id}">
          <span>${opt.label}</span>
          <span class="tone-dot"></span>
        </button>
      `).join('')}
    </div>
    ${isBad ? renderPhotoPrompt(item.id) : ''}
    ${isBad ? '<button class="btn-primary" id="continue-btn" style="margin-top:16px;">Continuar</button>' : ''}
    <button class="skip-link" id="skip-btn">Saltar este punto</button>
  `;
}

// Acordeón: todas las sub-partes apiladas, solo una abierta a la vez.
// groupSubIndex = cuál está abierta ahora mismo (-1 = todas cerradas).
function renderGroupStep(step){
  const answeredCount = step.subitems.filter(si=>answers[si.id]).length;

  const sections = step.subitems.map((si, idx)=>{
    const isOpen = idx === groupSubIndex;
    const currentAnswer = answers[si.id];
    const isBad = toneForAnswer(si, currentAnswer) === 'bad';
    const answered = !!currentAnswer;

    return `
      <div class="accordion-section ${isOpen?'open':''}">
        <button class="accordion-header" data-accordion-idx="${idx}">
          <span>${si.label}${answered?' ✓':''}</span>
          <span class="accordion-chevron">${isOpen?'−':'+'}</span>
        </button>
        ${isOpen ? `
          <div class="accordion-body">
            <div class="option-list">
              ${si.options.map(opt=>`
                <button class="option-btn option-btn-group ${currentAnswer===opt.id?'selected':''}" data-tone="${opt.tone}" data-item="${si.id}" data-opt="${opt.id}">
                  <span>${opt.label}</span>
                  <span class="tone-dot"></span>
                </button>
              `).join('')}
            </div>
            ${isBad ? renderPhotoPrompt(si.id) : ''}
            ${isBad ? '<button class="btn-primary" id="continue-btn" style="margin-top:16px;">Continuar</button>' : ''}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  return `
    <div class="item-screen">
      <h2 class="item-title">${step.groupLabel}</h2>
      <p class="item-hint">${answeredCount} de ${step.subitems.length} partes revisadas</p>
    </div>
    <div class="accordion-list">${sections}</div>
    <button class="skip-link" id="skip-btn">Saltar esta parte</button>
  `;
}

function renderReview(){
  const rows = ITEMS.map((item)=>{
    const ansVal = answers[item.id];
    const tone = toneForAnswer(item, ansVal);
    const labels = labelsForAnswer(item, ansVal);
    const label = item.group ? `${item.groupLabel} · ${item.label}` : item.label;
    return `
      <div class="review-row" data-jump-item="${item.id}">
        <span class="rl-label">${label}${pendingPhotos[item.id] ? ' 📷' : ''}</span>
        ${labels.length
          ? `<span class="rl-val"><span class="dot ${tone}"></span>${labels.join(', ')}<span class="chev">›</span></span>`
          : `<span class="rl-val empty">Sin responder<span class="chev">›</span></span>`
        }
      </div>
    `;
  }).join('');

  const verdict = computeVerdict();
  const cfg = {
    ok:   {color:'var(--ok)',  bg:'var(--ok-bg)',   title:'Estado correcto',   txt:'Ningún punto crítico detectado.'},
    warn: {color:'#8a6116',    bg:'var(--warn-bg)', title:'Estado regular',    txt:'Hay puntos a vigilar, sin urgencia.'},
    bad:  {color:'var(--bad)', bg:'var(--bad-bg)',  title:'Requiere atención', txt:'Al menos un punto crítico detectado.'},
  }[verdict];

  return `
    <div class="verdict-banner" style="background:${cfg.bg};">
      <div class="dot" style="background:${cfg.color};"></div>
      <div class="txt">
        <b style="color:${cfg.color};">${cfg.title}</b>
        <span>${cfg.txt}</span>
      </div>
    </div>
    <div class="card" style="padding:4px 12px;">${rows}</div>
    <div class="card">
      <div class="field" style="margin-bottom:0;">
        <label>Comentario / detalle libre</label>
        <textarea id="f-comment" placeholder="Cualquier detalle que no encaje arriba...">${form.comment}</textarea>
      </div>
    </div>
    <button class="btn-primary" id="save-btn">Guardar ficha</button>
    <button class="btn-secondary" id="restart-btn">Empezar otra ficha (vaciar)</button>
  `;
}

function computeVerdict(){
  const tones = ITEMS.map(it=> toneForAnswer(it, answers[it.id])).filter(Boolean);
  if(tones.includes('bad')) return 'bad';
  if(tones.filter(t=>t==='warn').length >= 1) return 'warn';
  return 'ok';
}

// Tras responder (o saltar) una sub-parte de un grupo: se cierra y se abre
// la siguiente en el acordeón, o se pasa al siguiente punto si era la última.
function advanceWithinGroupOrStep(){
  const step = WIZARD_STEPS[stepIndex-1];
  if(step && step.type === 'group'){
    const idx = groupSubIndex < 0 ? 0 : groupSubIndex;
    if(idx < step.subitems.length - 1){
      groupSubIndex = idx + 1;
      renderWizard();
      return;
    }
  }
  if(stepIndex <= WIZARD_STEPS.length){ goToStep(stepIndex+1); }
}

function wireStepEvents(){
  const startBtn = document.getElementById('start-btn');
  if(startBtn){
    startBtn.addEventListener('click', ()=>{
      form.city = document.getElementById('f-city').value;
      form.plate = document.getElementById('f-plate').value.trim();
      if(!form.city){ showToast('Selecciona una ciudad'); return; }
      goToStep(1);
    });
  }

  const plateInput = document.getElementById('f-plate');
  if(plateInput){
    plateInput.addEventListener('input', ()=>{ form.plate = plateInput.value; });
  }
  const citySelect = document.getElementById('f-city');
  if(citySelect){
    citySelect.addEventListener('change', updatePlateDatalist);
    updatePlateDatalist();
  }
  const camBtn = document.getElementById('plate-cam-btn');
  const photoInput = document.getElementById('plate-photo');
  if(camBtn && photoInput){
    camBtn.addEventListener('click', ()=> photoInput.click());
    photoInput.addEventListener('change', handlePlatePhoto);
  }

  document.querySelectorAll('.option-btn:not(.option-btn-multi):not(.option-btn-group)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const itemId = btn.dataset.item;
      const optId = btn.dataset.opt;
      const tone = btn.dataset.tone;
      answers[itemId] = optId;

      if(tone === 'bad'){
        // No avanza solo: se queda para ofrecer la foto opcional y esperar a "Continuar"
        renderWizard();
      } else {
        btn.classList.add('selected');
        setTimeout(()=>{
          if(stepIndex <= WIZARD_STEPS.length){ goToStep(stepIndex+1); }
        }, 220);
      }
    });
  });

  document.querySelectorAll('.option-btn-group').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const itemId = btn.dataset.item;
      const optId = btn.dataset.opt;
      const tone = btn.dataset.tone;
      answers[itemId] = optId;

      if(tone === 'bad'){
        renderWizard(); // se queda en la misma sub-parte para ofrecer la foto
      } else {
        btn.classList.add('selected');
        setTimeout(()=>{ advanceWithinGroupOrStep(); }, 220);
      }
    });
  });

  document.querySelectorAll('.accordion-header').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.accordionIdx, 10);
      groupSubIndex = (groupSubIndex === idx) ? -1 : idx; // tocar la que ya está abierta la cierra
      renderWizard();
    });
  });

  document.querySelectorAll('.photo-add-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      photoTargetCampo = btn.dataset.campo;
      document.getElementById('photo-input').click();
    });
  });
  document.querySelectorAll('.photo-remove-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      delete pendingPhotos[btn.dataset.campo];
      renderWizard();
    });
  });

  document.querySelectorAll('.option-btn-multi').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const itemId = btn.dataset.item;
      const optId = btn.dataset.opt;
      const isExclusive = btn.dataset.exclusive === '1';
      const current = Array.isArray(answers[itemId]) ? [...answers[itemId]] : [];

      if(isExclusive){
        // selecting the exclusive option clears everything else
        answers[itemId] = current.includes(optId) ? [] : [optId];
      } else {
        // selecting any non-exclusive option drops the exclusive one
        const item = itemById(itemId);
        const exclusiveIds = item.options.filter(o=>o.exclusive).map(o=>o.id);
        let next = current.filter(id=>!exclusiveIds.includes(id));
        if(next.includes(optId)){
          next = next.filter(id=>id!==optId);
        } else {
          next.push(optId);
        }
        answers[itemId] = next;
      }
      renderWizard();
    });
  });

  const continueBtn = document.getElementById('continue-btn');
  if(continueBtn){
    continueBtn.addEventListener('click', ()=>{
      const step = WIZARD_STEPS[stepIndex-1];
      if(step && step.type === 'group'){
        advanceWithinGroupOrStep();
      } else if(stepIndex <= WIZARD_STEPS.length){
        goToStep(stepIndex+1);
      }
    });
  }

  const skipBtn = document.getElementById('skip-btn');
  if(skipBtn){
    skipBtn.addEventListener('click', ()=>{
      const step = WIZARD_STEPS[stepIndex-1];
      if(step && step.type === 'group'){
        // saltar solo esta sub-parte, sin marcarla como respondida
        const total = step.subitems.length;
        const idx = groupSubIndex < 0 ? 0 : groupSubIndex;
        if(idx < total - 1){
          groupSubIndex = idx + 1;
          renderWizard();
        } else {
          goToStep(stepIndex+1);
        }
      } else {
        goToStep(stepIndex+1);
      }
    });
  }

  document.querySelectorAll('.review-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const loc = ITEM_STEP_LOOKUP[row.dataset.jumpItem];
      if(!loc) return;
      stepIndex = loc.stepIdx + 1;
      groupSubIndex = loc.subIdx;
      renderWizard();
    });
  });

  const saveBtn = document.getElementById('save-btn');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      form.comment = document.getElementById('f-comment').value.trim();
      await saveCurrentEntry();
    });
  }

  const restartBtn = document.getElementById('restart-btn');
  if(restartBtn){
    restartBtn.addEventListener('click', ()=>{
      if(confirm('¿Vaciar esta ficha y empezar una nueva?')) resetWizard();
    });
  }
}

// ---- Plate photo OCR (best effort) ----
let tesseractLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('no se pudo cargar el lector'));
    document.head.appendChild(s);
  });
  return tesseractLoadPromise;
}

function cleanPlateGuess(raw){
  // Keep only letters/numbers/dashes, uppercase, take the most plate-like token
  const cleaned = (raw||'').toUpperCase().replace(/[^A-Z0-9\- \n]/g,' ');
  const tokens = cleaned.split(/[\s\n]+/).filter(Boolean);
  // Prefer a token with both letters and digits, length 5-9 (typical plate shape)
  const platelike = tokens.find(t => /[0-9]/.test(t) && /[A-Z]/.test(t) && t.length>=5 && t.length<=9);
  return (platelike || tokens.join('') || '').slice(0,10);
}

async function handlePlatePhoto(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('plate-status');
  const plateInput = document.getElementById('f-plate');

  const previewUrl = URL.createObjectURL(file);
  statusEl.className = 'plate-status busy';
  statusEl.innerHTML = `⏳ Leyendo matrícula…<br><img class="plate-thumb" src="${previewUrl}">`;

  try{
    await loadTesseract();
    const worker = await Tesseract.createWorker('eng');
    const { data:{ text } } = await worker.recognize(file);
    await worker.terminate();
    const guess = cleanPlateGuess(text);
    if(guess){
      plateInput.value = guess;
      form.plate = guess;
      statusEl.className = 'plate-status ok';
      statusEl.innerHTML = `✓ Lectura sugerida: <b>${guess}</b> — revisa que sea correcta.`;
    } else {
      statusEl.className = 'plate-status';
      statusEl.innerHTML = `No se pudo leer con claridad, escríbela manualmente.`;
    }
  }catch(e){
    statusEl.className = 'plate-status';
    statusEl.innerHTML = `No se pudo leer automáticamente, escríbela manualmente.`;
  }
}

// ---- Borrador local: que no se pierda lo rellenado si se cierra la pestaña ----
const DRAFT_KEY = 'audit_draft';

function saveDraftToLocalStorage(){
  try{
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      auditId: currentAuditId,
      stepIndex,
      groupSubIndex,
      form,
      answers,
    }));
  }catch(e){ /* almacenamiento no disponible, no pasa nada, se sigue funcionando en memoria */ }
}

function clearDraftFromLocalStorage(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}

function tryRestoreDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return false;
    const draft = JSON.parse(raw);
    if(!draft || !draft.form || !draft.form.city) return false; // no hay nada real que recuperar
    currentAuditId = draft.auditId || crypto.randomUUID();
    stepIndex = draft.stepIndex || 0;
    groupSubIndex = draft.groupSubIndex || 0;
    form = draft.form;
    answers = draft.answers || {};
    return true;
  }catch(e){ return false; }
}

function resetWizard(){
  form = {city:'', plate:'', comment:''};
  answers = {};
  pendingPhotos = {};
  stepIndex = 0;
  groupSubIndex = 0;
  currentAuditId = crypto.randomUUID();
  clearDraftFromLocalStorage();
  renderWizard();
}

function showAccessGate(errorMsg){

  document.getElementById('access-gate-error').textContent = errorMsg || '';

function hideAccessGate(){

document.getElementById('access-gate-form').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const input = document.getElementById('access-gate-input');

  if(!val) return;
  const submitBtn = ev.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true; submitBtn.textContent = 'Comprobando...';

  try{

      document.getElementById('access-gate-error').textContent = 'Código incorrecto.';
      submitBtn.disabled = false; submitBtn.textContent = 'Entrar';
      return;
    }
    accessCode = val;

    hideAccessGate();

function renderStorageBanner(){

  el.innerHTML = `<div class="storage-banner ok">● Conectado a tu base de datos real — se guarda para todo el equipo, entres desde donde entres.</div>`;
}

function computeVerdictForAnswers(answersObj){
  const tones = ITEMS.map(it=> toneForAnswer(it, answersObj[it.id])).filter(Boolean);
  if(tones.includes('bad')) return 'bad';
  if(tones.filter(t=>t==='warn').length >= 1) return 'warn';
  return 'ok';
}

async function loadInspections(){
  try{
    const res = await fetch(API_BASE + '/api/audits', { headers: {'X-Access-Code': accessCode} });
    if(res.status === 401){ handleUnauthorized(); return null; }
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    return data.map(item=>{
      const rawAnswers = {...(item.answers || {})};
      const comment = rawAnswers.comment || '';
      delete rawAnswers.comment;
      return {
        id: item.audit_id,
        date: item.created_at,
        city: item.city,
        plate: item.plate,
        answers: rawAnswers,
        photos: item.photos || {},
        comment,
        verdict: computeVerdictForAnswers(rawAnswers),
      };
    });
  }catch(e){
    console.error(e);
    return null; // null = fallo de red, distinto de "lista vacía"
  }
}

async function uploadPendingPhotos(auditId){
  const photoKeys = {};
  for(const [campo, file] of Object.entries(pendingPhotos)){
    try{
      const res = await fetch(
        `${API_BASE}/api/photos?audit_id=${encodeURIComponent(auditId)}&campo=${encodeURIComponent(campo)}`,
        { method: 'POST', headers: {'Content-Type': file.type || 'image/jpeg', 'X-Access-Code': accessCode}, body: file }
      );
      if(res.status === 401){ handleUnauthorized(); continue; }
      if(res.ok){
        const data = await res.json();
        photoKeys[campo] = data.key;
      }
    }catch(e){ console.error('No se pudo subir la foto de', campo, e); }
  }
  return photoKeys;
}

async function saveAuditToApi(entry, photoKeys){
  try{
    const res = await fetch(API_BASE + '/api/audits', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Access-Code': accessCode},
      body: JSON.stringify({
        audit_id: entry.id,
        city: entry.city,
        plate: entry.plate,
        answers: {...entry.answers, comment: entry.comment || ''},
        photo_keys: photoKeys || {},
      }),
    });
    if(res.status === 401){ handleUnauthorized(); return false; }
    return res.ok;
  }catch(e){ console.error(e); return false; }
}

async function deleteAuditFromApi(auditId){
  try{
    const res = await fetch(API_BASE + '/api/audits?audit_id=' + encodeURIComponent(auditId), {
      method: 'DELETE',
      headers: {'X-Access-Code': accessCode},
    });
    if(res.status === 401){ handleUnauthorized(); return false; }
    return res.ok;
  }catch(e){ console.error(e); return false; }
}

async function saveCurrentEntry(){
  const saveBtn = document.getElementById('save-btn');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Guardando...'; }

  const entry = {
    id: currentAuditId,
    date: new Date().toISOString(),

}

        </div>
        <div class="hist-badges">
          <span class="badge ${badgeClass}">${badgeText}</span>
          ${flagged.map(f=> f.photoKey
            ? `<a class="badge ${f.tone}" style="text-decoration:none;" href="${API_BASE}/api/photos/${f.photoKey}?code=${encodeURIComponent(accessCode)}" target="_blank">📷 ${f.label}</a>`
            : `<span class="badge ${f.tone}">${f.label}</span>`
          ).join('')}
        </div>
        ${e.comment ? `<div class="hist-comment">"${escapeHtml(e.comment)}"</div>` : ''}
        <button class="hist-del" data-id="${e.id}">Eliminar ficha</button>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.hist-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('¿Eliminar esta ficha?')) return;
      const ok = await deleteAuditFromApi(btn.dataset.id);
      if(!ok) showToast('No se pudo eliminar, revisa la conexión');
      renderHistory();
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ---- Export / Import ----
document.getElementById('export-json').addEventListener('click', async ()=>{
  const list = await loadInspections();
  if(list === null){ showToast('Sin conexión con el servidor'); return; }
  downloadFile('auditoria_flota.json', JSON.stringify(list, null, 2), 'application/json');
});
document.getElementById('export-csv').addEventListener('click', async ()=>{
  const list = await loadInspections();
  if(list === null){ showToast('Sin conexión con el servidor'); return; }
  if(list.length===0){ showToast('No hay fichas para exportar'); return; }
  const itemIds = ITEMS.map(it=>it.id);
  const header = ['fecha','ciudad','matricula','veredicto','comentario', ...ITEMS.map(it=>it.label)];
  const rows = list.map(e=>[
    e.date, e.city, e.plate, e.verdict, (e.comment||'').replace(/[\n,]/g,' '),
    ...itemIds.map(id=>{
      const it = itemById(id);
      const ansVal = (e.answers||{})[id];
      return labelsForAnswer(it, ansVal).join(' / ');
    })
  ]);
  // Punto y coma como separador (el que usa Excel por defecto en España/UE) y BOM
  // para que los acentos se vean bien — así una coma dentro de una respuesta
  // (p. ej. "Desgastados, no se pueden leer") nunca descuadra las columnas.
  const csv = [header, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  downloadFile('auditoria_flota.csv', '\ufeff' + csv, 'text/csv;charset=utf-8;');
});
function downloadFile(name, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('import-file').addEventListener('change', async (ev)=>{
  const file = ev.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const imported = JSON.parse(text);
    if(!Array.isArray(imported)) throw new Error('formato inválido');
    let added = 0;
    for(const e of imported){
      if(e && e.id){
        const ok = await saveAuditToApi(e);
        if(ok) added++;
      }
    }
    showToast(added > 0 ? `${added} ficha(s) importada(s)` : 'No se pudo importar ninguna');
    renderHistory();
  }catch(e){
    showToast('No se pudo leer ese archivo JSON');
  }
  ev.target.value = '';
});

document.getElementById('clear-all-btn').addEventListener('click', async ()=>{
  if(!confirm('¿Seguro que quieres borrar TODAS las fichas guardadas? Esto no se puede deshacer.')) return;
  const list = await loadInspections();
  if(list === null){ showToast('Sin conexión con el servidor'); return; }
  let allOk = true;
  for(const entry of list){
    const ok = await deleteAuditFromApi(entry.id);
    if(!ok) allOk = false;
  }
  showToast(allOk ? 'Historial vaciado' : 'Algunas fichas no se pudieron borrar');
  renderHistory();
});

renderStorageBanner();

// ---- PWA install handling ----
let deferredInstallPrompt = null;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());

function renderInstallBanner(mode){
  const el = document.getElementById('install-banner');
  if(isStandalone || !mode){ el.innerHTML = ''; return; }

  if(mode === 'android'){
    el.innerHTML = `
      <div class="install-banner">
        <div class="txt"><b>Instala la app</b>Añádela a tu pantalla de inicio para abrirla como una app.</div>
        <button id="do-install-btn">Instalar</button>
      </div>`;
    document.getElementById('do-install-btn').addEventListener('click', async ()=>{
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      renderInstallBanner(null);
    });
  } else if(mode === 'ios'){
    el.innerHTML = `
      <div class="install-banner">
        <div class="txt"><b>Instala la app</b>Toca el botón compartir (□↑) de Safari y elige "Añadir a pantalla de inicio".</div>
      </div>`;
  }
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  renderInstallBanner('android');
});

if(isIOS && !isStandalone){
  renderInstallBanner('ios');
}

function showUpdateBanner(){
  const el = document.getElementById('update-banner');
  el.innerHTML = `
    <div class="install-banner">
      <div class="txt"><b>Nueva actualización disponible</b>Toca para cargar la última versión.</div>
      <button id="do-update-btn">Actualizar</button>
    </div>`;
  document.getElementById('do-update-btn').addEventListener('click', ()=>{
    location.reload();
  });
}

// Service worker real, servido como archivo propio (necesario para que Chrome
// ofrezca instalar la app de verdad). Falla en silencio si no aplica (p. ej. archivo local).
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then((reg)=>{
    // Si ya hay un Service Worker esperando (se descargó una versión nueva
    // mientras la pestaña estaba cerrada), avisamos directamente.
    if(reg.waiting && navigator.serviceWorker.controller){
      showUpdateBanner();
    }
    reg.addEventListener('updatefound', ()=>{
      const newWorker = reg.installing;
      if(!newWorker) return;
      newWorker.addEventListener('statechange', ()=>{
        // "installed" + ya había un controlador antes = es una actualización real,
        // no la primera vez que se instala el Service Worker.
        if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
          showUpdateBanner();
        }
      });
    });
  }).catch(()=>{ /* no soportado en este contexto, se ignora */ });
}
